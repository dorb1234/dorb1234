<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הסטודיו של Bloomy | בונים זר</title>
<meta name="description" content="בונים זר משלכם בתלת־ממד: בוחרים פרחים, עטיפה, ומוסיפים לסל.">
<meta name="theme-color" content="#fffaf8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=13">
<link rel="stylesheet" href="css/build.css?v=13">
<script>(function(){var r=document.documentElement,t=null;try{t=localStorage.getItem('bloomy-theme')}catch(e){}r.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
</head>
<body class="bpage">

<header class="b-top">
  <a class="b-back" href="index.html" aria-label="חזרה לאתר">→</a>
  <a class="brand" href="index.html" dir="ltr">bloomy<span class="brand-star">✻</span></a>
  <a class="b-cart" href="index.html#cart" aria-label="לסל">
    <svg viewBox="0 0 24 24"><path d="M5 8h14l-1.3 11.2a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
    <b class="badge" id="cart-count" hidden>0</b>
  </a>
</header>

<a class="ga-bar" id="ga-bar" href="giveaway.html" hidden>🎁 <b>מצב הגרלה</b> · <span id="ga-left"></span></a>

<main class="b-app">
  <!-- the bouquet -->
  <section class="b-stage" id="stage" aria-label="הזר שלכם">
    <div class="b-price">
      <strong id="b-price">0 ₪</strong>
      <small id="b-stems">0 גבעולים</small>
    </div>
        <div class="bq3" id="bq3" data-wrap="kraft">
          <div class="bq-scene" id="bq-scene">
            <svg class="wrap-back" id="wrap-back" viewBox="0 0 400 440" aria-hidden="true">
              <defs>
                <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .22"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
                <linearGradient id="wb1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--p3)"/><stop offset=".5" style="stop-color:var(--p1)"/><stop offset="1" style="stop-color:var(--p3)"/></linearGradient>
                <linearGradient id="wb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--t1)"/><stop offset="1" style="stop-color:var(--t2)"/></linearGradient>
              </defs>
              <path class="tissue" d="M16 172 C46 122 84 142 112 106 C150 70 176 96 200 80 C226 96 252 70 290 106 C318 142 356 122 384 172 L224 352 L176 352 Z" fill="url(#wb2)"/>
              <path class="paper" d="M44 158 Q200 104 356 158 L222 352 L178 352 Z" fill="url(#wb1)" filter="url(#grain)"/>
            </svg>
            <div class="bq-heads" id="bq-heads"></div>
            <svg class="wrap-front" id="wrap-front" viewBox="0 0 400 440" aria-hidden="true">
              <defs>
                <linearGradient id="wfl" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" style="stop-color:var(--p2)"/><stop offset=".55" style="stop-color:var(--p1)"/><stop offset="1" style="stop-color:var(--p3)"/></linearGradient>
                <linearGradient id="wfr" x1="1" y1="0" x2="0" y2=".3"><stop offset="0" style="stop-color:var(--p3)"/><stop offset=".6" style="stop-color:var(--p1)"/><stop offset="1" style="stop-color:var(--p2)"/></linearGradient>
                <linearGradient id="rib" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--r1)"/><stop offset=".45" style="stop-color:var(--r2)"/><stop offset="1" style="stop-color:var(--r3)"/></linearGradient>
                <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
              </defs>
              <g id="bq-stems"></g>
              <path class="paper" d="M22 212 Q105 262 214 274 L213 354 L183 352 Z" fill="url(#wfl)" filter="url(#grain)"/>
              <path class="paper" d="M378 206 Q300 258 186 280 L217 352 L187 354 Z" fill="url(#wfr)" filter="url(#grain)"/>
              <path class="fold" d="M70 232 L192 350 M330 230 L208 350 M140 258 L198 350" style="stroke:var(--p3)" stroke-width="1.2" fill="none" opacity=".55"/>
              <path class="edge" d="M22 212 Q105 262 214 274 M378 206 Q300 258 186 280" stroke="#fff" stroke-opacity=".5" stroke-width="2" fill="none"/>
              <path class="sheen" d="M90 238 L196 346 L206 346 L120 246Z M300 236 L204 346 L212 346 L318 232Z" fill="url(#sheen)"/>
              <g class="ribbon">
                <path d="M172 338 Q200 346 228 338 L230 358 Q200 366 170 358Z" fill="url(#rib)"/>
                <path d="M200 350 C178 330 140 326 138 348 C136 368 172 364 200 352Z" fill="url(#rib)"/>
                <path d="M200 350 C222 330 260 326 262 348 C264 368 228 364 200 352Z" fill="url(#rib)"/>
                <path d="M196 354 C186 380 172 400 158 418 L170 422 C184 404 196 384 202 358Z M204 354 C214 380 228 400 242 418 L230 422 C216 404 204 384 198 358Z" fill="url(#rib)"/>
                <ellipse cx="200" cy="351" rx="10" ry="9" style="fill:var(--r2)"/>
                <path d="M146 342 C160 336 176 338 190 348" stroke="#fff" stroke-opacity=".45" stroke-width="2" fill="none"/>
              </g>
            </svg>
          </div>
          <div class="bq-shadow" aria-hidden="true"></div>
        </div>
    <p class="b-empty" id="stage-empty">בחרו פרחים כדי להתחיל 🌷</p>
    <div class="b-tools">
      <button type="button" class="b-tool" id="b-undo" aria-label="ביטול הפעולה האחרונה" disabled>↶</button>
      <button type="button" class="b-tool" id="b-shuffle" aria-label="סידור מחדש">⟳</button>
      <button type="button" class="b-tool" id="b-clear" aria-label="ניקוי הזר">🗑</button>
    </div>
    <p class="b-hint" aria-hidden="true">⟲ אפשר להזיז את הזר באצבע</p>
  </section>

  <!-- the controls -->
  <section class="b-panel">
    <nav class="b-steps" role="tablist" aria-label="שלבים">
      <button type="button" role="tab" class="on" data-go="0" aria-selected="true"><span>1</span>פרחים</button>
      <button type="button" role="tab" data-go="1" aria-selected="false"><span>2</span>עטיפה</button>
      <button type="button" role="tab" data-go="2" aria-selected="false"><span>3</span>סיום</button>
    </nav>

    <div class="b-pane" data-pane="0">
      <div class="b-quick">
        <span>התחלה מהירה:</span>
        <div class="b-scroll" id="presets"></div>
      </div>
      <div class="b-tabs b-scroll" id="ftabs" role="tablist" aria-label="סוגי פרחים"></div>
      <div class="b-tray" id="tray"></div>
    </div>

    <div class="b-pane" data-pane="1" hidden>
      <p class="b-lead">באיזו עטיפה לעטוף?</p>
      <div class="b-wraps" role="radiogroup" aria-label="עטיפה">
        <label><input type="radio" name="wrap" value="kraft"><span><i class="wk kraft"></i><b>נייר קראפט</b><small>חם וטבעי</small></span></label>
        <label><input type="radio" name="wrap" value="blush"><span><i class="wk blush"></i><b>ורוד עדין</b><small>רך ורומנטי</small></span></label>
        <label><input type="radio" name="wrap" value="white"><span><i class="wk white"></i><b>לבן</b><small>נקי ואלגנטי</small></span></label>
        <label><input type="radio" name="wrap" value="clear"><span><i class="wk clear"></i><b>שקוף</b><small>רואים כל פרח</small></span></label>
      </div>
    </div>

    <div class="b-pane" data-pane="2" hidden>
      <p class="b-lead">הזר שלכם</p>
      <ul class="b-summary" id="summary"></ul>
      <form class="ga-form" id="ga-form" hidden onsubmit="return false">
        <label>למי הזר? <input id="ga-to" maxlength="40" placeholder="לאמא, לנועה, לעצמי…" autocomplete="off"></label>
        <label>כמה מילים קצרות <small>(<span id="ga-count">0</span>/120)</small><textarea id="ga-msg" rows="3" maxlength="120" placeholder="למה דווקא הזר הזה, ולמה דווקא לה/לו?"></textarea></label>
        <div class="ga-two">
          <label>השם שלך <input id="ga-name" maxlength="40" autocomplete="name"></label>
          <label>האינסטגרם שלך <small>(לא חובה)</small><input id="ga-ig" maxlength="40" dir="ltr" placeholder="@" autocomplete="off"></label>
        </div>
      </form>
      <a class="b-ask" id="b-ask" target="_blank" rel="noopener">יש שאלה? שולחים את ההרכב בוואטסאפ</a>
      <p class="fine">ההדמיה מראה את ההרכב שבחרתם, לא את הזר המדויק שיישלח. מינימום 50 ₪ לזר, לפני משלוח.</p>
    </div>

    <footer class="b-foot">
      <p class="b-note" id="b-note" aria-live="polite"></p>
      <div class="b-foot-row">
        <button type="button" class="btn btn-ghost sm" id="b-prev" hidden><span>→</span></button>
        <button type="button" class="btn btn-solid grow" id="b-next"><span>לבחירת עטיפה</span><i>←</i></button>
      </div>
    </footer>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/data.js?v=13"></script>
<script src="js/bouquet2d.js?v=13"></script>
<script src="js/build.js?v=13"></script>
</body>
</html>
